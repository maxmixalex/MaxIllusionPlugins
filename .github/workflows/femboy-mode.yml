name: FemboyMode build

on:
  pull_request:
    paths:
      - 'src/FemboyMode/**'
      - 'tests/FemboyMode.Tests/**'
      - 'scripts/Collect-KoikatsuBinaries.ps1'
      - '.github/workflows/femboy-mode.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'nuget.config'
  push:
    branches:
      - main
    paths:
      - 'src/FemboyMode/**'
      - 'tests/FemboyMode.Tests/**'
      - 'scripts/Collect-KoikatsuBinaries.ps1'
      - '.github/workflows/femboy-mode.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'nuget.config'
  workflow_dispatch:

permissions:
  contents: read

# A pull request already builds every update to the feature branch. Avoid a
# second push build and cancel obsolete runs after rapid source changes.
concurrency:
  group: femboy-mode-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KK_FemboyMode (.NET Framework 3.5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/FemboyMode/FemboyMode.csproj

      - name: Build
        run: dotnet build src/FemboyMode/FemboyMode.csproj -c Release --no-restore

      - name: Restore headless test harness
        run: dotnet restore tests/FemboyMode.Tests/FemboyMode.Tests.csproj

      - name: Run FemboyMode regression assertions
        run: dotnet run --project tests/FemboyMode.Tests/FemboyMode.Tests.csproj -c Release --no-restore

      - name: Validate Windows collector PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/Collect-KoikatsuBinaries.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Output 'Collector PowerShell syntax OK'

      - name: Package plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KK_FemboyMode
          path: bin/Release/FemboyMode/KK_FemboyMode.dll
          if-no-files-found: error
          retention-days: 14
