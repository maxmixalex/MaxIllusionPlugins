name: Temporary FlatLock offline wheelhouse
on:
  push:
    branches: [feat/femboy-character-flag]
    paths:
      - '.github/workflows/flatlock-wheelhouse-temp.yml'
permissions:
  contents: read
jobs:
  wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download UnityPy toolchain dependencies
        run: |
          mkdir -p wheelhouse
          python -m pip wheel --wheel-dir wheelhouse 'UnityPy==1.20.26' 'tpk_ar==0.2.4'
          echo "Wheels downloaded:"
          ls -lh wheelhouse
      - name: Upload offline wheels
        uses: actions/upload-artifact@v4
        with:
          name: flatlock-offline-wheelhouse
          path: wheelhouse/
          compression-level: 0
          retention-days: 1
